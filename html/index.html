<!DOCTYPE html>
<html lang="pt">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="../js/index.js" ></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início</title>

</head>

<body>

    <header>
 
        <h1>Login</h1>

    </header>

    <main> 
        
        <h2>Criar conta</h2>

        <label for="id_usuario">Usuário:</label>
        <input type="text" placeholder="Escreva seu nome aqui" id="id_usuario" onchange="verificar()"><br>

        <label for="id_senha">Senha:</label>
        <input type="text" placeholder="Escreva sua senha aqui" id="id_senha" onchange="verificar()"><br>

        <button id="id_botao_acesso" type="button" onclick="acesso()" class="desativado">Criar</button><br>

        <hr>

        <h2>Entrar</h2>

        <label for="id_usuario_logar">Usuário:</label>
        <input type="text" placeholder="Escreva seu nome aqui" id="id_usuario_logar" onchange="verificar()"><br>
        
        <label for="id_senha_logar">Senha:</label>
        <input type="text" placeholder="Escreva sua senha aqui" id="id_senha_logar" onchange="verificar()"><br>

        <button id="id_botao_acesso_logar" type="button" onclick="logar()" class="desativado"> Acessar</button><br>

        <hr>

        <button type="button" onclick="ranking()">Ver ranking</button><br>

    </main>

    <footer></footer>
    
</body>

</html>
