<!DOCTYPE html>
<html lang="pt">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Lock</title>

    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="../js/classe_blue_lock.js"></script>
    <script defer src="../js/banco_de_personagens.js"></script>
    <script defer src="../js/blue_lock.js"></script>
    <link rel="stylesheet" href="../css/blue_lock.css">

</head>

<body onload="completarListaDePersonagens()">

    <header>

        <h1>Anitermo</h1>

        <nav>

            <a href="index.html">Sair</a>

        </nav>


    </header>

    <hr>

    <main>

        <h1>Blue Lock</h1>

        <article>

            <p id="id_user"></p>
            <button type="button" onclick="ranking()">Ver ranking</button>

        </article>

        <hr>

        <article id="articleTimer">Comece a adivinhar para iniciar o cronômetro</article>

        <section>

            <label for="inputPesquisa">Adivinhar personagem:</label>
            <input type="text" id="inputChute" list="datalistPersonagens" placeholder="Chute aqui">

            <datalist id="datalistPersonagens"></datalist>

            <button type="button" onclick="iniciarChute()">Chutar</button>

        </section>

        <!--Table dos valores dos personagens-->
        <hr>

        <table>

            <thead>

                <tr>

                    <th>Arco</th>
                    <th>Posição</th>
                    <th>País</th>
                    <th>Clube</th>
                    <th>Cabelo</th>
                    <th>Olho</th>
                    <th>Altura</th>

                </tr>
                
            </thead>

            <tbody id="tbodyPersonagem"></tbody>

        </table>

        <!--testando se o ranking funciona-->
    
    </main>

    <hr>

    <footer></footer>
    
</body>

</html>
